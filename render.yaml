services:
  - type: web
    name: chunking-api
    runtime: python
    region: oregon  # or ohio, frankfurt, singapore
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.9
